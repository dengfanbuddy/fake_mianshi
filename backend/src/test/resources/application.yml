server:
  port: 0

spring:
  datasource:
    url: jdbc:sqlite:${java.io.tmpdir}/fm_test_mianshi.db?busy_timeout=30000&journal_mode=WAL
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

app:
  upload-dir: ./uploads
  audio-dir: ./uploads/audio
  # 测试环境禁止托管本地语音 sidecar：否则 @SpringBootTest 会真的 spawn Python 进程
  voice:
    local:
      auto-start: false
      stop-on-shutdown: false
      pid-file: target/test-voice-sidecar.pid
