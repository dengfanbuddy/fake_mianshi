server:
  port: 0

spring:
  datasource:
    url: jdbc:sqlite:./data/test_fake_mianshi.db
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

app:
  upload-dir: ./uploads
  audio-dir: ./uploads/audio
