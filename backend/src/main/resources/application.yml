server:
  port: 8080

spring:
  datasource:
    url: jdbc:sqlite:./data/fake_mianshi.db?busy_timeout=30000&journal_mode=WAL
    driver-class-name: org.sqlite.JDBC
  # 启动时执行 schema.sql（幂等建表，兼容克隆后的空库与已有库）
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

app:
  upload-dir: ./uploads
  audio-dir: ./uploads/audio
  # 语音供应商：tencent（腾讯云 API）或 local_qwen（本地 voice-service sidecar）
  voice:
    provider: ${VOICE_PROVIDER:tencent}
    local:
      base-url: ${QWEN_VOICE_URL:http://127.0.0.1:9100}
      connect-timeout-seconds: 5
      # 首次调用可能触发模型加载（数十秒），故放宽
      timeout-seconds: 120
      sample-rate: 16000
      # 本地合成失败是否自动回退腾讯云（腾讯云密钥可用时）
      fallback-to-tencent: true
      # 本地语音识别（Qwen3-ASR）：与 Qwen3-TTS 跑在同一个 sidecar 进程里
      asr:
        enabled: ${VOICE_LOCAL_ASR_ENABLED:true}
        # 强制语种，留空表示让模型自动检测（会顺带返回 language 字段）
        language: ${VOICE_LOCAL_ASR_LANGUAGE:}
        # 领域热词（system prompt 偏置）。本机实测：不给热词时 "JVM" 被识别成 "JYEM"，
        # 给了热词后整句逐字一致。留空则完全依赖模型自身先验。
        prompt: ${VOICE_LOCAL_ASR_PROMPT:术语：JVM、GC、Full GC、堆内存、垃圾回收、Redis、MySQL、Kubernetes、Spring、微服务、分布式、缓存、消息队列、幂等、熔断降级、索引、分库分表、线程池、事务、性能优化}
        timeout-seconds: 120
        # 中间结果刷新间隔（毫秒），0 = 关闭「边说边出字」，松手后才出文本
        partial-interval-ms: ${VOICE_LOCAL_ASR_PARTIAL_MS:2000}
        # 只在前 6 秒刷新中间结果。超过之后用户已经在往下说，中间结果价值不大，
        # 而正在跑的中间识别会和「松手后的最终识别」抢同一把 GPU 锁——实测 12s 的回答
        # 若中间识别在飞，松手到出文本要 3.5s；不抢占时只要 1.7s。
        partial-max-audio-seconds: ${VOICE_LOCAL_ASR_PARTIAL_MAX_SECONDS:6}
        partial-min-delta-ms: 700

tencent:
  cloud:
    secret-id: ${TENCENT_SECRET_ID:}
    secret-key: ${TENCENT_SECRET_KEY:}
    app-id: ${TENCENT_APP_ID:}
